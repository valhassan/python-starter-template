[project]
name = "python-starter-template"
version = "0.1.0"
requires-python = ">=3.10,<3.12"

dependencies = [
    "earthengine-api",
    "geemap",
    "rasterio",
    "geopandas",
    "folium",
    "pandas",
    "numpy",
    "matplotlib",
    "jupyterlab",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pre-commit",
]

[tool.ruff]
exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg",
    ".ipynb_checkpoints", ".mypy_cache", ".nox", ".pants.d", ".pyenv",
    ".pytest_cache", ".pytype", ".ruff_cache", ".svn", ".tox", ".venv",
    ".vscode", "__pypackages__", "_build", "buck-out", "build", "dist",
    "node_modules", "site-packages", "venv"
]
line-length = 88
indent-width = 4
target-version = "py311"
select = ["ALL"]
ignore = ["D203", "D212", "ANN101", "ANN102"]

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
